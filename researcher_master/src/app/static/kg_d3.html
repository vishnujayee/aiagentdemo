<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>KG D3 Visualizer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; }
    #graph { width: 70%; height: 800px; float: left; border-right: 1px solid #ddd; }
    #panel { width: 28%; float: left; padding: 10px; }
    .node circle { stroke: #fff; stroke-width: 1.5px; }
    .node text { pointer-events: none; font-size: 10px; }
    .snippet { background: #f8f8f8; padding: 6px; margin-bottom: 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <h2>Knowledge Graph — Interactive Visualizer</h2>
  <div id="graph"></div>
  <div id="panel">
    <h3 id="nodeTitle">Select a node</h3>
    <div id="nodeInfo">Click a node to see mapped chunks and snippets.</div>
  </div>

  <script>
    async function fetchKG() {
      const kgResp = await fetch('/kg');
      const kg = await kgResp.json();
      const mappingResp = await fetch('/kg/mapping');
      const mapping = await mappingResp.json();
      return {kg, mapping};
    }

    function buildGraph(kg) {
      const nodes = kg.nodes.map(n => ({id: n.label, size: n.count || 1}));
      const edges = kg.edges.map(e => ({source: e.source, target: e.target, value: e.count || 1}));
      return {nodes, edges};
    }

    function render({nodes, edges}, mapping) {
      const width = document.getElementById('graph').clientWidth;
      const height = 800;

      const svg = d3.select('#graph').append('svg').attr('width', width).attr('height', height);

      const link = svg.append('g')
        .attr('stroke', '#999')
        .attr('stroke-opacity', 0.6)
        .selectAll('line')
        .data(edges)
        .join('line')
        .attr('stroke-width', d => Math.sqrt(d.value));

      const node = svg.append('g')
        .attr('stroke', '#fff')
        .attr('stroke-width', 1.5)
        .selectAll('g')
        .data(nodes)
        .join('g')
        .attr('class', 'node')
        .call(drag(simulation));

      node.append('circle')
        .attr('r', d => Math.max(4, Math.sqrt(d.size) * 3))
        .attr('fill', '#69b3a2')
        .on('click', (event, d) => showNodePanel(d.id, mapping));

      node.append('text')
        .attr('x', 6)
        .attr('y', 3)
        .text(d => d.id.substring(0, 30));

      const simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(edges).id(d => d.id).distance(80))
        .force('charge', d3.forceManyBody().strength(-150))
        .force('center', d3.forceCenter(width / 2, height / 2));

      simulation.on('tick', () => {
        link
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);

        node.attr('transform', d => `translate(${d.x},${d.y})`);
      });

      function drag(simulation){
        return d3.drag()
          .on('start', (event, d) => {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x; d.fy = d.y;
          })
          .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
          .on('end', (event, d) => {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null; d.fy = null;
          });
      }
    }

    function showNodePanel(label, mapping) {
      const panel = document.getElementById('nodeInfo');
      const title = document.getElementById('nodeTitle');
      title.textContent = label;
      panel.innerHTML = '';
      const entry = mapping[label];
      if (!entry) {
        panel.textContent = 'No mapping for this node.';
        return;
      }
      const list = entry.mapping || [];
      if (!list.length) {
        panel.textContent = 'No mapped chunks.';
        return;
      }
      list.forEach((m, i) => {
        const d = document.createElement('div');
        d.className = 'snippet';
        d.innerHTML = `<strong>${m.doc_id}</strong> (score: ${m.score.toFixed(3)})<div><pre>${escapeHtml(m.text.slice(0,1000))}</pre></div>`;
        panel.appendChild(d);
      });
    }

    function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    (async () => {
      const {kg, mapping} = await fetchKG();
      const graph = buildGraph(kg);
      render(graph, mapping);
    })();
  </script>
</body>
</html>
