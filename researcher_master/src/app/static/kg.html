<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>KG Mapping Visualizer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .node { border: 1px solid #ddd; padding: 8px; margin: 6px; display:block; }
    .mapping { margin-left: 12px; font-size: 0.9em; color: #333 }
    pre { background:#f8f8f8; padding:8px; overflow:auto }
  </style>
</head>
<body>
  <h1>KG → Chunk Mapping</h1>
  <div id="nodes"></div>
  <script>
    async function loadMapping(){
      const res = await fetch('/kg/mapping');
      const data = await res.json();
      const cont = document.getElementById('nodes');
      cont.innerHTML = '';
      for (const label in data){
        const entry = data[label];
        const div = document.createElement('div');
        div.className = 'node';
        const title = document.createElement('div');
        title.innerHTML = '<strong>' + label + '</strong>';
        div.appendChild(title);
        const nod = document.createElement('div');
        nod.className = 'mapping';
        const list = entry.mapping || [];
        nod.innerHTML = '<em>Top mappings ('+list.length+')</em>' +
          '<ol>' + list.map(m => `<li><strong>${m.doc_id}</strong> (score=${m.score.toFixed(3)})<pre>${m.text.slice(0,300).replace(/</g,'&lt;')}</pre></li>`).join('') + '</ol>';
        div.appendChild(nod);
        cont.appendChild(div);
      }
    }
    loadMapping();
  </script>
</body>
</html>
