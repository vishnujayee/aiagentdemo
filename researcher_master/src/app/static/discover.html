<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Discovery Queue</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 12px; }
    .item { border: 1px solid #ddd; padding: 8px; margin-bottom: 8px; border-radius: 4px; }
    .controls { margin-top: 6px; }
    button { margin-right: 6px; }
  </style>
</head>
<body>
  <h2>Discovery Queue</h2>
  <div id="controls">
    <button id="refresh">Refresh</button>
  </div>
  <div id="queue"></div>

  <script>
    async function fetchQueue(){
      const resp = await fetch('/admin/discover/queue');
      const data = await resp.json();
      return data.queue || [];
    }

    function render(list){
      const q = document.getElementById('queue');
      q.innerHTML = '';
      list.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item';
        const i = item.item || item;
        div.innerHTML = `<strong>${i.title || i.url || i.id}</strong><div>${(i.snippet||'').slice(0,500)}</div><div class="controls"><button data-id="${item.id}" class="accept">Accept</button><button data-id="${item.id}" class="reject">Reject</button><a href="${i.url || '#'}" target="_blank">Open source</a></div>`;
        q.appendChild(div);
      });
      document.querySelectorAll('.accept').forEach(b => b.onclick = async (e)=>{ const id = e.target.dataset.id; await fetch('/admin/discover/accept', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({id})}); refresh(); });
      document.querySelectorAll('.reject').forEach(b => b.onclick = async (e)=>{ const id = e.target.dataset.id; await fetch('/admin/discover/reject', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({id})}); refresh(); });
    }

    async function refresh(){
      const list = await fetchQueue();
      render(list);
    }

    document.getElementById('refresh').onclick = refresh;
    refresh();
  </script>
</body>
</html>
